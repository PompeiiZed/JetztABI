// ==================== CALC STATE PERSISTENCE ====================
var CALC_STORAGE_KEY='abiRechnerState_v1';
function saveCalcState(){
  try{
    localStorage.setItem(CALC_STORAGE_KEY, JSON.stringify({
      calcSubjects:S.calcSubjects, calcExams:S.calcExams,
      calcSeminarEnabled:S.calcSeminarEnabled, calcSeminar:S.calcSeminar,
      calcNextId:S.calcNextId
    }));
  }catch(e){}
}
function loadCalcState(){
  try{
    var raw=localStorage.getItem(CALC_STORAGE_KEY);
    if(!raw)return;
    var d=JSON.parse(raw);
    if(d.calcSubjects&&d.calcSubjects.length)S.calcSubjects=d.calcSubjects;
    if(d.calcExams&&d.calcExams.length)S.calcExams=d.calcExams;
    if(typeof d.calcSeminarEnabled==='boolean')S.calcSeminarEnabled=d.calcSeminarEnabled;
    if(d.calcSeminar)S.calcSeminar=d.calcSeminar;
    if(d.calcNextId)S.calcNextId=d.calcNextId;
  }catch(e){}
}
loadCalcState();

// ==================== PROGRESS / GAMIFICATION PERSISTENCE ====================
var PROGRESS_STORAGE_KEY='abiProgressState_v1';
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDateStr(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function saveProgressState(){
  try{
    localStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify({
      activityLog:S.activityLog, xp:S.xp, topicsLearned:S.topicsLearned,
      flashcardsReviewed:S.flashcardsReviewed, cardsToday:S.cardsToday,
      cardsTodayDate:S.cardsTodayDate, studySeconds:S.studySeconds,
      qDailyCount:S.qDailyCount, qDailyDate:S.qDailyDate
    }));
  }catch(e){}
}
function loadProgressState(){
  try{
    var raw=localStorage.getItem(PROGRESS_STORAGE_KEY);
    if(raw){
      var d=JSON.parse(raw);
      S.activityLog=d.activityLog||{};
      S.xp=typeof d.xp==='number'?d.xp:0;
      S.topicsLearned=d.topicsLearned||[];
      S.flashcardsReviewed=d.flashcardsReviewed||[];
      S.cardsToday=d.cardsToday||[];
      S.cardsTodayDate=d.cardsTodayDate||'';
      S.studySeconds=d.studySeconds||0;
      S.qDailyCount=d.qDailyCount||0;
      S.qDailyDate=d.qDailyDate||'';
    }
  }catch(e){}
  if(S.cardsTodayDate!==todayStr()){ S.cardsToday=[]; S.cardsTodayDate=todayStr(); }
  if(S.qDailyDate!==todayStr()){ S.qDailyCount=0; S.qDailyDate=todayStr(); }
  S.streak=computeStreak();
}
function qDailyRollover(){
  var t=todayStr();
  if(S.qDailyDate!==t){ S.qDailyDate=t; S.qDailyCount=0; }
}
function computeStreak(){
  var days=Object.keys(S.activityLog).filter(function(k){return S.activityLog[k]&&S.activityLog[k].actions>0;}).sort();
  if(!days.length) return 0;
  var todayD=new Date(); todayD.setHours(0,0,0,0);
  var last=parseDateStr(days[days.length-1]);
  var diff=Math.round((todayD-last)/86400000);
  if(diff>1) return 0; // streak broken: missed at least one full day
  var streak=1, cursor=last;
  for(var i=days.length-2;i>=0;i--){
    var d2=parseDateStr(days[i]);
    var dd=Math.round((cursor-d2)/86400000);
    if(dd===1){ streak++; cursor=d2; } else if(dd!==0){ break; }
  }
  return streak;
}
// Marks today as "active" and optionally awards XP. This is what makes streak,
// XP, and progress stats real instead of static placeholders.
function recordActivity(xpGain){
  var t=todayStr();
  if(!S.activityLog[t]) S.activityLog[t]={xp:0,actions:0};
  S.activityLog[t].actions++;
  if(xpGain){ S.activityLog[t].xp+=xpGain; S.xp+=xpGain; }
  S.streak=computeStreak();
  saveProgressState();
}
loadProgressState();
setInterval(function(){
  if(document.visibilityState==='visible'){ S.studySeconds+=30; saveProgressState(); }
},30000);

var profileSyncTimer=null;

function applyProfileRow(row){
  if(!row||!S.user)return;
  S.user.bundesland   = row.bundesland || S.user.bundesland || '';
  // Datenminimierung: Schulform wird nur lokal in der Sitzung gehalten und nicht serverseitig gespeichert.
  S.user.abiYear      = row.abi_year || S.user.abiYear || '2027';
  S.user.lk           = row.lk_subjects || S.user.lk || [];
  S.user.subs         = row.other_subjects || S.user.subs || [];
  if(typeof row.premium==='boolean') S.user.premium = row.premium;
  // Only overwrite locally-cached grades if the server actually has saved data
  if(row.calc_state && typeof row.calc_state==='object' && row.calc_state.calcSubjects && row.calc_state.calcSubjects.length){
    S.calcSubjects       = row.calc_state.calcSubjects;
    S.calcExams          = row.calc_state.calcExams || S.calcExams;
    S.calcSeminarEnabled = !!row.calc_state.calcSeminarEnabled;
    S.calcSeminar        = row.calc_state.calcSeminar || S.calcSeminar;
    S.calcNextId         = row.calc_state.calcNextId || S.calcNextId;
    saveCalcState();
  }
}

// Returns true if the user already has a saved profile with a bundesland (i.e. finished onboarding before)
async function fetchProfile(userId){
  if(!sb) return null;
  try{
    var res=await sb.from('profiles').select('*').eq('id',userId).maybeSingle();
    if(res.error){ console.warn('Profil konnte nicht geladen werden:',res.error.message); return null; }
    return res.data||null;
  }catch(e){ console.warn('Profil-Abruf fehlgeschlagen (evtl. offline):',e); return null; }
}

async function saveProfileNow(){
  if(!sb||!S.user||!S.user.id) return;
  try{
    await sb.from('profiles').upsert({
      id:S.user.id,
      full_name:S.user.name||null,
      bundesland:S.user.bundesland||null,
      abi_year:S.user.abiYear||null,
      lk_subjects:S.user.lk||[],
      other_subjects:S.user.subs||[],
      premium:!!S.user.premium,
      calc_state:{
        calcSubjects:S.calcSubjects, calcExams:S.calcExams,
        calcSeminarEnabled:S.calcSeminarEnabled, calcSeminar:S.calcSeminar,
        calcNextId:S.calcNextId
      },
      updated_at:new Date().toISOString()
    },{onConflict:'id'});
  }catch(e){ console.warn('Profil konnte nicht gespeichert werden (evtl. offline):',e); }
}

// Debounced sync so we don't hit the network on every keystroke/render
function queueProfileSync(){
  if(!sb||!S.user||!S.user.id) return;
  if(profileSyncTimer) clearTimeout(profileSyncTimer);
  profileSyncTimer=setTimeout(saveProfileNow,1200);
}

function captureFocus(){
  var el=document.activeElement;
  if(el&&el.id&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')){
    var sel=null;
    try{ sel={start:el.selectionStart,end:el.selectionEnd}; }catch(e){}
    return {id:el.id,sel:sel};
  }
  return null;
}
function restoreFocus(f){
  if(!f)return;
  var el=document.getElementById(f.id);
  if(el){
    el.focus();
    if(f.sel&&typeof f.sel.start==='number'&&el.setSelectionRange){
      try{ el.setSelectionRange(f.sel.start,f.sel.end); }catch(e){}
    }
  }
}
function render(){
  var focus=captureFocus();
  var app=document.getElementById('app');
  while(app.firstChild)app.removeChild(app.firstChild);
  document.body.className=S.dark?'dark':'';
  app.appendChild(buildPage());
  restoreFocus(focus);
  saveCalcState();
  queueProfileSync();
}

// ==================== CALCULATOR LOGIC ====================
function calcBlockI(){
  initCalcDefaults();
  var subjects=S.calcSubjects;
  var lkDoubled=0;
  var wSum=0, wCount=0;
  subjects.forEach(function(sub){
    var isDoubled=sub.lk&&lkDoubled<2;
    if(sub.lk) lkDoubled++;
    var w=isDoubled?2:1;
    sub.grades.forEach(function(g){
      if(g!==''&&g!==null&&!isNaN(+g)){
        wSum+=Math.min(15,Math.max(0,+g))*w;
        wCount+=w;
      }
    });
  });
  if(wCount===0) return 0;
  return Math.min(600,Math.round((wSum/wCount)*40));
}
function calcSeminarScore(sem){
  var s=sem.schriftl, p=sem.praes;
  if(s===''||p===''||isNaN(+s)||isNaN(+p)) return null;
  return Math.round((Math.min(15,+s)*3+Math.min(15,+p)*1)/2);
}
function calcBlockII(){
  initCalcDefaults();
  var exams=S.calcExams.filter(function(e){return e.grade!==''&&!isNaN(+e.grade);});
  if(exams.length===0) return 0;
  var factor=exams.length>=5?4:5;
  var total=exams.reduce(function(sum,e){return sum+Math.min(15,Math.max(0,+e.grade))*factor;},0);
  return Math.min(300,total);
}

var GRADE_TABLE=[
  [823,900,'1,0'],[805,822,'1,1'],[787,804,'1,2'],[769,786,'1,3'],[751,768,'1,4'],
  [733,750,'1,5'],[715,732,'1,6'],[697,714,'1,7'],[679,696,'1,8'],[661,678,'1,9'],
  [643,660,'2,0'],[625,642,'2,1'],[607,624,'2,2'],[589,606,'2,3'],[571,588,'2,4'],
  [553,570,'2,5'],[535,552,'2,6'],[517,534,'2,7'],[499,516,'2,8'],[481,498,'2,9'],
  [463,480,'3,0'],[445,462,'3,1'],[427,444,'3,2'],[409,426,'3,3'],[391,408,'3,4'],
  [373,390,'3,5'],[355,372,'3,6'],[337,354,'3,7'],[319,336,'3,8'],[301,318,'3,9'],
  [300,300,'4,0']
];
function pointsToGrade(total){
  var t=Math.round(total);
  if(t<300) return null;
  for(var i=0;i<GRADE_TABLE.length;i++){
    var b=GRADE_TABLE[i];
    if(t>=b[0]&&t<=b[1]) return b[2];
  }
  return null;
}
function calcResult(){
  var b1=calcBlockI();
  var semBonus=0;
  if(isBayern()&&S.calcSeminarEnabled){
    S.calcSeminar.forEach(function(sem){var sc=calcSeminarScore(sem);if(sc!==null)semBonus+=sc;});
  }
  var blockI=Math.min(600,b1+semBonus);
  var blockII=calcBlockII();
  var total=blockI+blockII;
  if(total<1) return null;
  var passed=total>=300&&blockI>=200&&blockII>=100;
  var gradeStr=pointsToGrade(total);
  var gradeDisplay=passed?(gradeStr||'nicht bestanden'):'nicht bestanden';
  var lkCount=S.calcSubjects.filter(function(s){return s.lk;}).length;
  var defizite=0;
  S.calcSubjects.forEach(function(sub){
    sub.grades.forEach(function(g){if(g!==''&&!isNaN(+g)&&+g<5)defizite++;});
  });
  return {blockI:blockI,blockII:blockII,total:total,grade:gradeDisplay,gradeRaw:gradeStr,passed:passed,defizite:defizite,semBonus:semBonus};
}
function getLkDoubledStatus(){
  var count=0;
  var status={};
  S.calcSubjects.forEach(function(sub){
    if(sub.lk){
      count++;
      status[sub.id]=count<=2?'doubled':'lk_only';
    } else {
      status[sub.id]='gk';
    }
  });
  return status;
}

function comboKey(a,b){ var order='RIASEC'; return order.indexOf(a)<order.indexOf(b)?a+b:b+a; }
var RIASEC_DIM_QCOUNT=5, RIASEC_DIM_MAX=RIASEC_DIM_QCOUNT*5, RIASEC_DIM_MIN=RIASEC_DIM_QCOUNT*1;
function computeDegreeMatches(scores){
  var dims='RIASEC'.split('');
  var norm={};
  dims.forEach(function(d){ norm[d]=scores[d]/RIASEC_DIM_MAX; });
  var maxDist=Math.sqrt(dims.length);
  var userTop2=dims.slice().sort(function(a,b){return scores[b]-scores[a];}).slice(0,2);
  return DEGREES_LIST.map(function(deg){
    var distSq=0;
    dims.forEach(function(d){ var diff=norm[d]-(deg.riasec&&deg.riasec[d]!=null?deg.riasec[d]:0); distSq+=diff*diff; });
    var pct=Math.max(0,Math.round((1-Math.sqrt(distSq)/maxDist)*100));
    var degTop2=deg.riasec?dims.slice().sort(function(a,b){return deg.riasec[b]-deg.riasec[a];}).slice(0,2):[];
    var overlap=degTop2.filter(function(d){return userTop2.indexOf(d)!==-1;});
    var reason;
    if(overlap.length===2){ reason='Deckt sich sehr stark mit deinen beiden stärksten Interessensbereichen: '+RIASEC_INFO[userTop2[0]].name+' & '+RIASEC_INFO[userTop2[1]].name+'.'; }
    else if(overlap.length===1){ reason='Passt gut zu deinem Interessenschwerpunkt '+RIASEC_INFO[overlap[0]].name+' ('+RIASEC_INFO[overlap[0]].short+').'; }
    else{ reason='Ergänzt dein Profil eher um andere Stärken ('+degTop2.map(function(d){return RIASEC_INFO[d].name;}).join(' & ')+') als um deine Top-Interessen.'; }
    return {deg:deg,pct:pct,reason:reason};
  }).sort(function(a,b){ return b.pct-a.pct; });
}

function buildUniApp(){
  var d=document.createElement('div');d.style.cssText='padding:16px 18px';
  var back=document.createElement('button');back.style.cssText='background:none;border:none;color:#1d4ed8;font-weight:700;font-size:13px;cursor:pointer;padding:0;margin-bottom:12px;display:flex;align-items:center;gap:4px';back.innerHTML='← Zurück zum Dashboard';back.onclick=function(){setTab('home');};d.appendChild(back);

  var intro=document.createElement('div');intro.style.cssText='margin-bottom:16px';
  intro.innerHTML='<h2 style="font-weight:800;font-size:19px;margin-bottom:3px">🎓 Studium & Bewerbung</h2><p style="color:#64748b;font-size:12px;margin:0">Finde dein Studienfach, informiere dich über Finanzierung und bewirb dich richtig.</p>';
  d.appendChild(intro);

  var tabDefs=[{id:'test',label:'🧭 Interessen-Test'},{id:'degrees',label:'📖 Studiengänge'},{id:'funding',label:'💰 Stipendien'},{id:'motivation',label:'✍️ Motivation'},{id:'howto',label:'📝 Bewerbung'}];
  var tabBar=document.createElement('div');tabBar.style.cssText='display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px';
  tabDefs.forEach(function(t){
    var active=S.uniAppTab===t.id;
    var b=document.createElement('button');b.style.cssText='white-space:nowrap;padding:8px 14px;border-radius:10px;border:none;font-size:12px;font-weight:700;cursor:pointer;background:'+(active?'#059669':(S.dark?'#1e293b':'#f1f5f9'))+';color:'+(active?'#fff':(S.dark?'#94a3b8':'#64748b'));
    b.textContent=t.label;b.onclick=function(){S.uniAppTab=t.id;render();};tabBar.appendChild(b);
  });
  d.appendChild(tabBar);

  var content=document.createElement('div');
  if(S.uniAppTab==='test') content.appendChild(buildUniTest());
  else if(S.uniAppTab==='degrees') content.appendChild(buildUniDegrees());
  else if(S.uniAppTab==='funding') content.appendChild(buildUniFunding());
  else if(S.uniAppTab==='motivation') content.appendChild(buildUniMotivation());
  else if(S.uniAppTab==='howto') content.appendChild(buildUniHowTo());
  d.appendChild(content);
  return d;
}

function buildUniTest(){
  var wrap=document.createElement('div');

  if(S.uniTestResult){
    var res=S.uniTestResult;
    var top2=res.top2, combo=res.combo, scores=res.scores;
    var head=document.createElement('div');head.className='card';head.style.cssText='padding:18px;margin-bottom:14px;background:linear-gradient(135deg,#059669,#0d9488);color:#fff';

    wrap.appendChild(head);

    var barsCard=document.createElement('div');barsCard.className='card';barsCard.style.cssText='padding:16px;margin-bottom:14px';

    'RIASEC'.split('').forEach(function(dim){
      var pct=Math.round((scores[dim]/RIASEC_DIM_MAX)*100);
      var row=document.createElement('div');row.style.cssText='margin-bottom:8px';
      row.innerHTML='<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span>'+RIASEC_INFO[dim].name+'</span><span style="color:#94a3b8">'+RIASEC_INFO[dim].short+'</span></div><div style="height:8px;background:'+(S.dark?'#334155':'#e2e8f0')+';border-radius:4px"><div style="width:'+pct+'%;height:100%;border-radius:4px;background:'+(top2.indexOf(dim)!==-1?'#059669':'#94a3b8')+'"></div></div>';
      barsCard.appendChild(row);
    });
    wrap.appendChild(barsCard);

// ==================== CALCULATOR ====================
// Lightweight, targeted update used while typing grades into the calculator.
// It only touches the small set of result elements (by id) instead of
// rebuilding the whole calculator DOM, so inputs never lose focus/cursor
// and the numbers update instantly as you type.
function refreshCalcUI(){
  if(S.page!=='main'||S.tab!=='calc') return;
  var res=calcResult();
  var gv=document.getElementById('calc-grade-val');
  if(gv){ gv.textContent=res?res.grade:'–'; gv.style.fontSize=((res&&!res.passed)?24:44)+'px'; }
  var bi=document.getElementById('calc-blockI-val'); if(bi&&res) bi.textContent=res.blockI+'/600';
  var b2v=document.getElementById('calc-blockII-val'); if(b2v&&res) b2v.textContent=res.blockII+'/300';
  var tot=document.getElementById('calc-total-val'); if(tot&&res) tot.textContent=res.total+'/900';
  var ps=document.getElementById('calc-pass-status');
  if(ps&&res) ps.innerHTML=(res.passed?'✅ Bestanden':'⚠️ Noch nicht bestanden')+' · Defizite: '+res.defizite;

  S.calcSubjects.forEach(function(sub){
    var validGrades=sub.grades.filter(function(g){return g!==''&&!isNaN(+g);});
    var avg=validGrades.length>0?(validGrades.reduce(function(s,v){return s+(+v);},0)/validGrades.length).toFixed(1):'–';
    var avgCol=avg==='–'?'#94a3b8':(+avg>=10?'#16a34a':(+avg>=5?'#d97706':'#dc2626'));
    var el=document.getElementById('calc-avg-'+sub.id);
    if(el){ el.textContent=avg; el.style.color=avgCol; }
  });

  if(isBayern()&&S.calcSeminarEnabled){
    S.calcSeminar.forEach(function(sem,si){
      var score=calcSeminarScore(sem);
      var scoreEl=document.getElementById('calc-sem-score-'+si);
      if(scoreEl) scoreEl.innerHTML=score!==null?' → <span style="color:#1d4ed8">'+score+'/30 Punkte</span>':'';
      var noteEl=document.getElementById('calc-sem-note-'+si);
      if(noteEl) noteEl.textContent=score!==null?'Formel: (Schriftlich×3 + Präs.×1) ÷ 2 = '+score+' von max. 30 Punkten':'';
    });
  }

  var filledExams=S.calcExams.filter(function(e){return e.grade!==''&&!isNaN(+e.grade);});
  var factor=filledExams.length>=5?4:5;
  var factorLabel=document.getElementById('calc-b2-factor-label');
  if(factorLabel) factorLabel.textContent='Punkte (×'+factor+')';
  S.calcExams.forEach(function(exam){
    var weighted=exam.grade!==''&&!isNaN(+exam.grade)?Math.min(15,Math.max(0,+exam.grade))*factor:'–';
    var wCol=weighted==='–'?'#94a3b8':(+weighted>=40?'#16a34a':(+weighted>=20?'#d97706':'#dc2626'));
    var el=document.getElementById('calc-w-'+exam.id);
    if(el){ el.textContent=weighted; el.style.color=wCol; }
  });
  var b2Total=calcBlockII();
  var b2TotalEl=document.getElementById('calc-b2-total');
  if(b2TotalEl) b2TotalEl.innerHTML='<b>Block II Summe: '+b2Total+'/300 Punkte</b> '+(b2Total>=100?'✅ (≥100 Pkt., bestanden)':'⚠️ (min. 100 Pkt. nötig)');

  if(S._calcActivityToday!==todayStr()){
    S._calcActivityToday=todayStr();
    recordActivity(0);
  }
}

function sendAI(text){
  if(!text||!text.trim())return;
  S.aiMsgs.push({role:'user',text:text.trim()});S.aiInput='';render();
  setTimeout(function(){
    var t=text.toLowerCase();var reply;
    if(t.indexOf('ableit')>=0||t.indexOf('analysis')>=0||t.indexOf('integral')>=0||t.indexOf('mathe')>=0||t.indexOf('stochastik')>=0||t.indexOf('vektor')>=0) reply=AI_REPLIES.math;
    else if(t.indexOf('weimar')>=0||t.indexOf('geschichte')>=0||t.indexOf('kalter krieg')>=0||t.indexOf('ns-')>=0||t.indexOf('nationalsozialist')>=0) reply=AI_REPLIES.his;
    else if(t.indexOf('meiose')>=0||t.indexOf('bio')>=0||t.indexOf('genetik')>=0||t.indexOf('dna')>=0||t.indexOf('evolution')>=0) reply=AI_REPLIES.bio;
    else if(t.indexOf('photo')>=0||t.indexOf('physik')>=0||t.indexOf('newton')>=0||t.indexOf('quanten')>=0) reply=AI_REPLIES.phy;
    else reply=AI_REPLIES.default;

  },800);
}

  var cancel=document.createElement('button');cancel.className='btn-gray';cancel.style.cssText='width:100%';cancel.textContent='Abbrechen';cancel.onclick=closeAcctModal;
  m.body.appendChild(go2);m.body.appendChild(cancel);
  setTimeout(function(){try{inp.focus();}catch(e){}},50);
}

function showToastMsg(text){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:12.5px;font-weight:600;z-index:10000;max-width:90%;width:360px;box-shadow:0 10px 30px rgba(0,0,0,.3);line-height:1.5;text-align:center';
  t.textContent=text;document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },5200);
}

    updated:'Stand: '+(new Date().getFullYear()),
    sections:[
      {h:'1. Geltungsbereich und Vertragspartner',p:'Diese Allgemeinen Geschäftsbedingungen (nachfolgend "AGB") regeln die Nutzung der Webanwendung "Jetzt Abitur!" (nachfolgend "Dienst") einschließlich aller zugehörigen Funktionen, Inhalte und Unterseiten.\n\nAnbieter und Vertragspartner ist:\n'+LEGAL_OPERATOR.name+'\n'+LEGAL_OPERATOR.street+'\n'+LEGAL_OPERATOR.city+', '+LEGAL_OPERATOR.country+'\nVertreten durch: '+LEGAL_OPERATOR.represented+'\nE-Mail: '+LEGAL_OPERATOR.email+'\n\nMit der Registrierung eines Nutzerkontos erkennst du diese AGB in ihrer jeweils gültigen Fassung an. Abweichende oder entgegenstehende Bedingungen des Nutzers werden nicht Vertragsbestandteil, es sei denn, der Anbieter stimmt ihrer Geltung ausdrücklich in Textform zu.'},
      {h:'2. Leistungsbeschreibung',p:'Der Dienst stellt digitale Lern- und Orientierungshilfen für die Vorbereitung auf das Abitur sowie für die Studien- und Berufsorientierung bereit. Hierzu zählen insbesondere:\n\n• ein Abiturnoten-Rechner für die Bundesländer der Bundesrepublik Deutschland\n• Lerninhalte, Karteikarten und Übungsaufgaben zu verschiedenen Fächern\n• ein KI-gestützter Tutor-Chat\n• ein Interessen- und Eignungstest auf Basis des RIASEC-Modells\n• eine Datenbank zu Studiengängen, Zulassungswerten und Bewertungen\n• Informationen zu Stipendien, Bewerbungsverfahren und Finanzierung\n\nDer Anbieter entwickelt den Dienst fortlaufend weiter. Er ist berechtigt, einzelne Funktionen zu ändern, zu erweitern, einzuschränken oder einzustellen, soweit dies für den Nutzer zumutbar ist und der Kernzweck des Dienstes erhalten bleibt.'},
      {h:'3. Registrierung und Nutzerkonto',p:'Die Nutzung wesentlicher Funktionen setzt die Anlage eines Nutzerkontos voraus. Der Nutzer ist verpflichtet, bei der Registrierung wahrheitsgemäße und vollständige Angaben zu machen und diese bei Änderungen aktuell zu halten.\n\nZugangsdaten sind geheim zu halten und vor dem Zugriff Dritter zu schützen. Besteht der Verdacht, dass ein Dritter Kenntnis von den Zugangsdaten erlangt hat, ist der Anbieter unverzüglich zu informieren und das Passwort zu ändern. Der Nutzer haftet für alle Aktivitäten, die über sein Konto vorgenommen werden, sofern er die unbefugte Nutzung zu vertreten hat.\n\nEin Anspruch auf Registrierung besteht nicht. Der Anbieter behält sich vor, Registrierungen ohne Angabe von Gründen abzulehnen.'},
      {h:'4. Minderjährige Nutzer',p:'Der Dienst richtet sich seiner Natur nach überwiegend an Schülerinnen und Schüler der gymnasialen Oberstufe und damit teilweise an Minderjährige.\n\nNutzer unter 18 Jahren dürfen den Dienst nur mit Einwilligung ihrer Erziehungsberechtigten nutzen. Mit der Registrierung versichert der Nutzer, entweder volljährig zu sein oder über eine entsprechende Einwilligung zu verfügen. Für die datenschutzrechtliche Einwilligung gilt ergänzend Art. 8 DSGVO in Verbindung mit § 8 Abs. 1 der deutschen Umsetzung; maßgeblich ist insoweit das vollendete 16. Lebensjahr.\n\nDer Anbieter behält sich vor, in Zweifelsfällen einen Nachweis der Einwilligung zu verlangen und das Konto bis zur Vorlage zu sperren.'},
      {h:'5. Pflichten des Nutzers und untersagte Handlungen',p:'Der Nutzer verpflichtet sich, den Dienst ausschließlich im Rahmen der geltenden Gesetze und dieser AGB zu nutzen. Untersagt sind insbesondere:\n\n• das Einstellen rechtswidriger, beleidigender, diskriminierender, jugendgefährdender oder gewaltverherrlichender Inhalte\n• die Verletzung von Urheber-, Marken- oder Persönlichkeitsrechten Dritter\n• der Einsatz von Skripten, Bots, Crawlern oder sonstigen automatisierten Verfahren zum Auslesen von Inhalten\n• Versuche, Sicherheitsmaßnahmen zu umgehen, den Dienst zu überlasten oder dessen Verfügbarkeit zu beeinträchtigen\n• die Weitergabe des Nutzerkontos an Dritte sowie die gewerbliche Weiterveräußerung von Inhalten\n• das gezielte Herbeiführen missbräuchlicher oder rechtswidriger Ausgaben des KI-Tutors\n\nBei Verstößen ist der Anbieter berechtigt, Inhalte zu entfernen sowie das Konto vorübergehend zu sperren oder dauerhaft zu löschen. Weitergehende Ansprüche bleiben unberührt.'},
      {h:'6. Vergütung',p:'Die Nutzung des Dienstes ist im derzeitigen Funktionsumfang unentgeltlich. Der Anbieter behält sich vor, künftig kostenpflichtige Zusatzfunktionen einzuführen. Kostenpflichtige Leistungen werden vor Vertragsschluss eindeutig als solche gekennzeichnet; eine Zahlungspflicht entsteht ausschließlich nach ausdrücklicher und gesonderter Bestätigung durch den Nutzer.'},
      {h:'7. Hinweise zu KI-generierten Inhalten',p:'Teile des Dienstes, insbesondere der Tutor-Chat sowie einzelne Erläuterungen und Aufgaben, werden mithilfe von Systemen der künstlichen Intelligenz erzeugt.\n\nKI-Systeme können fachlich unzutreffende, unvollständige oder missverständliche Ausgaben erzeugen. Der Anbieter übernimmt keine Gewähr für die inhaltliche Richtigkeit, Vollständigkeit oder Aktualität KI-generierter Inhalte. Diese Inhalte stellen keine verbindliche fachliche, rechtliche, medizinische oder psychologische Beratung dar.\n\nDer Nutzer ist gehalten, sicherheits- oder prüfungsrelevante Angaben eigenständig anhand offizieller Quellen zu überprüfen, insbesondere anhand der Vorgaben des jeweils zuständigen Kultusministeriums.'},
      {h:'8. Keine Gewähr für Noten, Zulassung und Prüfungsergebnisse',p:'Die im Dienst bereitgestellten Notenrechner, Zulassungswerte (NC), Studiengangsbewertungen und Ergebnisse des Interessentests dienen ausschließlich der unverbindlichen Orientierung.\n\nBerechnungen erfolgen auf Grundlage der jeweils hinterlegten Prüfungsordnungen, die sich je Bundesland, Jahrgang und Schulform unterscheiden und kurzfristig geändert werden können. Angaben zu Numerus-clausus-Werten beruhen auf Durchschnittswerten vergangener Vergabeverfahren und lassen keinen verlässlichen Rückschluss auf künftige Verfahren zu.\n\nRechtlich verbindlich sind ausschließlich die Festsetzungen der Schule, der zuständigen Schulbehörde, der Stiftung für Hochschulzulassung sowie der jeweiligen Hochschule. Ein Anspruch auf ein bestimmtes Prüfungs-, Noten- oder Zulassungsergebnis lässt sich aus dem Dienst nicht ableiten.'},
      {h:'9. Rechte an Inhalten',p:'Sämtliche Inhalte des Dienstes, insbesondere Texte, Aufgaben, Datenbanken, Grafiken, Layouts und der zugrunde liegende Quellcode, sind urheberrechtlich geschützt und stehen dem Anbieter oder dessen Lizenzgebern zu.\n\nDer Nutzer erhält ein einfaches, nicht übertragbares, widerrufliches Recht, die Inhalte im Rahmen des vertragsgemäßen Gebrauchs zu eigenen, nicht kommerziellen Lern- und Ausbildungszwecken zu nutzen. Jede darüber hinausgehende Verwertung, insbesondere Vervielfältigung, Verbreitung, öffentliche Zugänglichmachung oder Bearbeitung, bedarf der vorherigen Zustimmung des Anbieters in Textform.\n\nAn Inhalten, die der Nutzer selbst einstellt, verbleiben die Rechte beim Nutzer. Der Nutzer räumt dem Anbieter ein einfaches Nutzungsrecht ein, soweit dies zur technischen Bereitstellung und zum Betrieb des Dienstes erforderlich ist.'},
      {h:'10. Verfügbarkeit',p:'Der Anbieter bemüht sich um eine möglichst unterbrechungsfreie Verfügbarkeit des Dienstes, schuldet jedoch keine bestimmte Verfügbarkeitsquote. Einschränkungen können insbesondere durch Wartungsarbeiten, Weiterentwicklungen, Störungen bei Vorleistern sowie durch Umstände außerhalb des Einflussbereichs des Anbieters (höhere Gewalt) entstehen. Geplante Wartungsarbeiten werden nach Möglichkeit angekündigt.'},
      {h:'11. Haftung',p:'Der Anbieter haftet unbeschränkt bei Vorsatz und grober Fahrlässigkeit, bei der Verletzung von Leben, Körper oder Gesundheit, nach den Vorschriften des Produkthaftungsgesetzes sowie im Umfang einer ausdrücklich übernommenen Garantie.\n\nBei einfach fahrlässiger Verletzung einer wesentlichen Vertragspflicht (Kardinalpflicht), deren Erfüllung die ordnungsgemäße Durchführung des Vertrages überhaupt erst ermöglicht und auf deren Einhaltung der Nutzer regelmäßig vertrauen darf, ist die Haftung auf den vertragstypischen, vorhersehbaren Schaden begrenzt.\n\nIm Übrigen ist die Haftung ausgeschlossen. Insbesondere besteht keine Haftung für Schäden, die aus dem Vertrauen auf die Richtigkeit von Notenberechnungen, NC-Angaben, Studiengangsbewertungen oder KI-generierten Inhalten entstehen.\n\nDie vorstehenden Haftungsbeschränkungen gelten auch zugunsten der gesetzlichen Vertreter und Erfüllungsgehilfen des Anbieters.'},
      {h:'12. Verlinkte Inhalte Dritter',p:'Der Dienst enthält Verweise auf externe Webseiten Dritter, etwa auf hochschulstart.de, uni-assist.de oder Stipendiendatenbanken. Auf deren Inhalte hat der Anbieter keinen Einfluss. Für die Inhalte verlinkter Seiten ist stets der jeweilige Anbieter verantwortlich. Zum Zeitpunkt der Verlinkung waren keine Rechtsverstöße erkennbar; bei Bekanntwerden von Rechtsverletzungen werden entsprechende Links unverzüglich entfernt.'},
      {h:'13. Laufzeit und Beendigung',p:'Der Nutzungsvertrag wird auf unbestimmte Zeit geschlossen. Der Nutzer kann sein Konto jederzeit und ohne Einhaltung einer Frist löschen oder die Löschung per E-Mail an den Anbieter verlangen.\n\nDer Anbieter kann den Vertrag mit einer Frist von vierzehn Tagen ordentlich kündigen. Das Recht zur außerordentlichen Kündigung aus wichtigem Grund, insbesondere bei erheblichen oder wiederholten Verstößen gegen Ziffer 5, bleibt unberührt.\n\nNach Beendigung werden die Daten des Nutzers nach Maßgabe der Datenschutzerklärung gelöscht, soweit keine gesetzlichen Aufbewahrungspflichten entgegenstehen.'},
      {h:'14. Änderungen dieser AGB',p:'Der Anbieter behält sich vor, diese AGB mit Wirkung für die Zukunft zu ändern, sofern dies aufgrund geänderter Rechtslage, Rechtsprechung oder wesentlicher Änderungen des Funktionsumfangs erforderlich wird. Über Änderungen wird der Nutzer mindestens dreißig Tage vor Inkrafttreten in Textform informiert. Widerspricht der Nutzer nicht innerhalb dieser Frist, gelten die Änderungen als angenommen; auf diese Wirkung wird in der Mitteilung gesondert hingewiesen. Im Falle eines Widerspruchs steht beiden Parteien ein Kündigungsrecht zu.'},
      {h:'15. Streitbeilegung',p:'Die Europäische Kommission stellt eine Plattform zur Online-Streitbeilegung bereit. Der Anbieter ist zur Teilnahme an einem Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle weder bereit noch verpflichtet.'},
      {h:'16. Schlussbestimmungen',p:'Es gilt das Recht der Bundesrepublik Deutschland unter Ausschluss des UN-Kaufrechts. Zwingende verbraucherschützende Vorschriften des Staates, in dem der Nutzer seinen gewöhnlichen Aufenthalt hat, bleiben unberührt.\n\nSollten einzelne Bestimmungen dieser AGB ganz oder teilweise unwirksam sein oder werden, bleibt die Wirksamkeit der übrigen Bestimmungen unberührt.'}

  datenschutz:{
    title:'Datenschutzerklärung',
    updated:'Stand: '+(new Date().getFullYear()),
    sections:[
      {h:'1. Verantwortlicher',p:'Verantwortlicher im Sinne der Datenschutz-Grundverordnung (DSGVO) ist:\n\n'+LEGAL_OPERATOR.name+'\n'+LEGAL_OPERATOR.street+'\n'+LEGAL_OPERATOR.city+', '+LEGAL_OPERATOR.country+'\nE-Mail: '+LEGAL_OPERATOR.email+'\n\nBei Fragen zum Datenschutz sowie zur Ausübung deiner Rechte kannst du dich jederzeit unter den vorstehenden Kontaktdaten an uns wenden.'},
      {h:'2. Grundsätze der Verarbeitung',p:'Wir verarbeiten personenbezogene Daten ausschließlich im Einklang mit der DSGVO und dem Bundesdatenschutzgesetz (BDSG). Personenbezogene Daten sind alle Informationen, die sich auf eine identifizierte oder identifizierbare natürliche Person beziehen.\n\nWir verarbeiten nur solche Daten, die für den Betrieb des Dienstes erforderlich sind (Grundsatz der Datenminimierung), und speichern sie nur so lange, wie es der jeweilige Zweck erfordert.'},
      {h:'3. Rechtsgrundlagen',p:'Die Verarbeitung erfolgt auf Grundlage der folgenden Vorschriften:\n\n• Art. 6 Abs. 1 lit. a DSGVO – Einwilligung, etwa bei optionalen Funktionen\n• Art. 6 Abs. 1 lit. b DSGVO – Erfüllung des Nutzungsvertrages, insbesondere bei Registrierung, Anmeldung und Bereitstellung der Lernfunktionen\n• Art. 6 Abs. 1 lit. c DSGVO – Erfüllung rechtlicher Verpflichtungen\n• Art. 6 Abs. 1 lit. f DSGVO – berechtigte Interessen, insbesondere an IT-Sicherheit, Missbrauchsabwehr und Stabilität des Dienstes'},
      {h:'4. Welche Daten wir verarbeiten, wo sie liegen und wozu',p:'Wir verarbeiten ausschließlich die nachfolgend abschließend aufgeführten Daten. Weitere personenbezogene Daten erheben wir nicht.\n\nA) KONTODATEN — Anzeigename, E-Mail-Adresse, Passwort-Hashwert, Zeitpunkt der Registrierung.\nZweck: Anlage und Absicherung deines Zugangs.\nSpeicherort: Datenbank unseres Backend-Dienstleisters innerhalb der EU.\nRechtsgrundlage: Art. 6 Abs. 1 lit. b DSGVO.\nDauer: bis zur Löschung des Kontos.\nHinweis: Der Anzeigename dient allein der Begrüßung in der App. Ein Spitzname genügt; die Angabe eines Klarnamens ist nicht erforderlich.\n\nB) PROFILDATEN — Bundesland, Abiturjahrgang, gewählte Leistungs- und Prüfungsfächer.\nZweck: korrekte Notenberechnung nach der jeweiligen Landesprüfungsordnung und Auswahl passender Lerninhalte. Ohne das Bundesland ist eine zutreffende Berechnung technisch nicht möglich.\nSpeicherort: wie unter A).\nRechtsgrundlage: Art. 6 Abs. 1 lit. b DSGVO.\nDauer: bis zur Löschung des Kontos.\n\nC) NOTEN- UND BERECHNUNGSDATEN — eingegebene Punktwerte, Kursnoten, Prüfungsergebnisse.\nZweck: Berechnung und geräteübergreifende Sicherung deines Abiturschnitts.\nSpeicherort: lokal im Speicher deines Browsers sowie, bei bestehendem Konto, in der Datenbank unseres Backend-Dienstleisters.\nRechtsgrundlage: Art. 6 Abs. 1 lit. b DSGVO.\nDauer: bis zur Löschung des Kontos oder bis du die Werte selbst entfernst.\nHinweis: Diese Angaben lassen Rückschlüsse auf schulische Leistungen zu. Sie werden ausschließlich zur Bereitstellung der von dir angeforderten Funktionen genutzt, nicht ausgewertet, nicht profiliert und nicht an Dritte weitergegeben.\n\nD) LERNFORTSCHRITT — XP, Streak, bearbeitete Themen, Karteikartenstände, Lernzeit.\nZweck: Darstellung deines Fortschritts und Wiederaufnahme an der zuletzt bearbeiteten Stelle.\nSpeicherort: lokal im Speicher deines Browsers; bei bestehendem Konto zusätzlich in der Datenbank.\nRechtsgrundlage: Art. 6 Abs. 1 lit. b DSGVO.\n\nE) ERGEBNIS DES INTERESSENTESTS — deine Antworten sowie das errechnete RIASEC-Profil.\nZweck: unverbindlicher Abgleich mit der Studiengangsdatenbank.\nSpeicherort: ausschließlich im Arbeitsspeicher deines Browsers während der laufenden Sitzung.\nDauer: wird beim Schließen der Anwendung verworfen und nicht an uns übermittelt.\n\nF) INHALTE DES KI-TUTORS — deine Eingaben im Tutor-Chat.\nZweck: Erzeugung einer Antwort.\nSpeicherort: ausschließlich im Arbeitsspeicher deines Browsers während der laufenden Sitzung. Der Verlauf wird weder dauerhaft gespeichert noch serverseitig abgelegt.\n\nG) TECHNISCHE ZUGRIFFSDATEN — IP-Adresse, Zeitpunkt, Browsertyp, Betriebssystem, aufgerufene Ressource.\nZweck: Auslieferung der Inhalte, Systemsicherheit, Missbrauchsabwehr.\nSpeicherort: Server-Logfiles unseres Hosting-Dienstleisters.\nRechtsgrundlage: Art. 6 Abs. 1 lit. f DSGVO.\nDauer: Löschung oder Anonymisierung nach spätestens dreißig Tagen.\n\nNICHT verarbeitet werden: Klarname (sofern nicht freiwillig angegeben), Anschrift, Telefonnummer, Geburtsdatum, Schulname, Standortdaten, Kontaktlisten, Gerätekennungen zu Werbezwecken sowie besondere Kategorien personenbezogener Daten nach Art. 9 DSGVO.'},
      {h:'4a. Grundsatz der Datenminimierung',p:'Wir erheben bewusst so wenige Daten wie möglich. Konkret bedeutet das:\n\n• Für die Registrierung genügen E-Mail-Adresse und Passwort; ein Klarname wird nicht verlangt.\n• Die Schulform wird nur während der laufenden Sitzung zur Anzeige verwendet und nicht dauerhaft gespeichert.\n• Die Ergebnisse des Interessentests und der Verlauf des KI-Tutors verlassen deinen Browser nicht.\n• Wir setzen keine Analyse-, Tracking- oder Werbedienste ein und erstellen keine Nutzungsprofile.\n• Wir verwenden keine Cookies zu Werbezwecken und binden keine Social-Media-Plugins ein.\n• Ein Verkauf oder eine Vermietung personenbezogener Daten findet unter keinen Umständen statt.'},
      {h:'5. Registrierung und Anmeldung',p:'Zur Anlage eines Nutzerkontos verarbeiten wir die unter Ziffer 4 lit. a genannten Daten. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO.\n\nPasswörter werden ausschließlich in Form kryptografischer Hashwerte gespeichert; eine Kenntnisnahme des Klartextpassworts durch uns ist ausgeschlossen.\n\nOptional kannst du dich über einen Drittanbieter-Login (Google) anmelden. In diesem Fall erhalten wir von Google die für die Kontoerstellung erforderlichen Daten, regelmäßig Name, E-Mail-Adresse und Profilkennung. Es gelten ergänzend die Datenschutzhinweise von Google. Rechtsgrundlage ist deine Einwilligung gemäß Art. 6 Abs. 1 lit. a DSGVO sowie Art. 6 Abs. 1 lit. b DSGVO.'},
      {h:'6. Eingesetzte Dienstleister und Drittanbieter-Software',p:'Wir setzen die folgenden Dienste ein. Mit jedem Auftragsverarbeiter besteht ein Vertrag nach Art. 28 DSGVO.\n\n1) HOSTING UND AUSLIEFERUNG — ein Content-Delivery-Network-Anbieter liefert die Anwendung aus. Dabei fallen die unter Ziffer 4 lit. G genannten Zugriffsdaten an.\n\n2) AUTHENTIFIZIERUNG UND DATENBANK — ein Backend-as-a-Service-Anbieter (Supabase) speichert Konto-, Profil-, Noten- und Fortschrittsdaten und wickelt die Anmeldung ab. Die zugehörige Client-Bibliothek wird beim Seitenaufruf von einem öffentlichen Paket-CDN geladen; dabei wird deine IP-Adresse technisch bedingt an dessen Betreiber übermittelt.\n\n3) SCHRIFTART — die Schriftfamilie "Inter" wird derzeit über Google Fonts geladen. Dabei wird deine IP-Adresse an Google übermittelt. Wir arbeiten daran, die Schriftdateien lokal auszuliefern, um diese Übermittlung vollständig zu vermeiden.\n\n4) ANMELDUNG ÜBER GOOGLE (optional) — nur bei aktiver Nutzung dieser Schaltfläche.\n\n5) ZAHLUNGSABWICKLUNG — sobald kostenpflichtige Funktionen aktiviert werden, erfolgt die Abwicklung über einen spezialisierten Zahlungsdienstleister. Vollständige Zahlungsdaten werden ausschließlich dort verarbeitet und gelangen zu keinem Zeitpunkt auf unsere Systeme.\n\nNICHT eingesetzt werden: Google Analytics oder vergleichbare Analysewerkzeuge, Werbenetzwerke, Social-Media-Plugins, Heatmap- oder Session-Recording-Software sowie Tracking-Pixel.'},
      {h:'6a. Löschung deines Kontos',p:'Du kannst dein Konto jederzeit selbst und ohne Angabe von Gründen löschen. Die Funktion findest du in der App unter Profil und Einstellungen im Bereich "Konto löschen".\n\nMit der Bestätigung werden gelöscht: dein Zugangskonto einschließlich E-Mail-Adresse, dein Profil, sämtliche Noten- und Berechnungsdaten, dein Lernfortschritt sowie alle auf dem Gerät lokal abgelegten Daten. Über den Abschluss der Löschung informieren wir dich zusätzlich per E-Mail an die zuletzt hinterlegte Adresse.\n\nDie Löschung erfolgt unverzüglich. Sie ist endgültig; eine Wiederherstellung ist technisch nicht möglich. Bestehen ausnahmsweise gesetzliche Aufbewahrungspflichten, etwa für Rechnungsbelege nach Handels- und Steuerrecht, werden die hiervon betroffenen Daten für jede weitere Verarbeitung gesperrt und nach Ablauf der Frist gelöscht.'},
      {h:'7. Verarbeitung im KI-Tutor',p:'In der aktuellen Version werden die Antworten des Tutor-Chats vollständig innerhalb deines Browsers aus einem fest hinterlegten Inhaltsbestand erzeugt. Deine Eingaben werden dabei weder an uns noch an einen Drittanbieter übermittelt und nicht gespeichert; der Verlauf wird beim Schließen der Anwendung verworfen.\n\nSobald ein externes Sprachmodell angebunden wird, werden deine Eingaben zur Erzeugung einer Antwort an den betreffenden Anbieter übermittelt. Wir werden diese Erklärung vor der Aktivierung entsprechend anpassen und dich gesondert informieren.\n\nBitte gib im Chat unabhängig davon keine besonderen Kategorien personenbezogener Daten nach Art. 9 DSGVO ein, insbesondere keine Gesundheitsdaten, und keine Daten Dritter.'},
      {h:'8. Server-Logfiles',p:'Bei jedem Aufruf werden automatisiert technische Zugriffsdaten erhoben und in Logfiles gespeichert. Diese Verarbeitung ist zur Auslieferung der Inhalte technisch erforderlich und dient der Systemsicherheit sowie der Aufklärung von Missbrauch.\n\nRechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO. Unser berechtigtes Interesse liegt in der Gewährleistung eines störungsfreien und sicheren Betriebs. Logfiles werden regelmäßig nach spätestens dreißig Tagen gelöscht oder anonymisiert.'},
      {h:'9. Cookies und lokale Speicherung',p:'Wir verwenden technisch notwendige Cookies und vergleichbare Speichertechnologien im Browser, insbesondere zur Aufrechterhaltung deiner Anmeldesitzung und zur Speicherung von Einstellungen wie dem Dunkelmodus.\n\nDiese Technologien sind für den Betrieb des Dienstes erforderlich; Rechtsgrundlage ist § 25 Abs. 2 Nr. 2 TDDDG in Verbindung mit Art. 6 Abs. 1 lit. f DSGVO. Eine Einwilligung ist hierfür nicht erforderlich.\n\nEine Nutzung von Cookies zu Werbe- oder Trackingzwecken durch Dritte findet nicht statt.'},
      {h:'10. Speicherdauer',p:'Bestands-, Lern- und Nutzungsdaten werden für die Dauer des Bestehens deines Nutzerkontos gespeichert.\n\nNach Löschung des Kontos werden die zugehörigen Daten unverzüglich gelöscht, soweit keine gesetzlichen Aufbewahrungspflichten, etwa aus Handels- oder Steuerrecht, entgegenstehen. In diesem Fall werden die betroffenen Daten für die weitere Verarbeitung gesperrt.'},
      {h:'11. Empfänger und Drittlandübermittlung',p:'Eine Weitergabe deiner Daten erfolgt ausschließlich an die unter Ziffer 6 genannten Auftragsverarbeiter sowie in Fällen, in denen wir gesetzlich zur Herausgabe verpflichtet sind. Ein Verkauf personenbezogener Daten findet nicht statt.\n\nSoweit Daten in Drittländer außerhalb der Europäischen Union übermittelt werden, erfolgt dies nur bei Vorliegen eines Angemessenheitsbeschlusses der Europäischen Kommission oder auf Grundlage der Standardvertragsklauseln nach Art. 46 Abs. 2 lit. c DSGVO nebst ergänzender Schutzmaßnahmen.'},
      {h:'12. Deine Rechte als betroffene Person',p:'Dir stehen gegenüber uns die folgenden Rechte zu:\n\n• Auskunft über die zu deiner Person verarbeiteten Daten (Art. 15 DSGVO)\n• Berichtigung unrichtiger oder unvollständiger Daten (Art. 16 DSGVO)\n• Löschung deiner Daten (Art. 17 DSGVO)\n• Einschränkung der Verarbeitung (Art. 18 DSGVO)\n• Datenübertragbarkeit in einem strukturierten, gängigen Format (Art. 20 DSGVO)\n• Widerspruch gegen Verarbeitungen auf Grundlage berechtigter Interessen (Art. 21 DSGVO)\n• Widerruf erteilter Einwilligungen mit Wirkung für die Zukunft (Art. 7 Abs. 3 DSGVO)\n\nZur Ausübung genügt eine formlose Mitteilung an '+LEGAL_OPERATOR.email+'. Die Bearbeitung erfolgt unentgeltlich und grundsätzlich innerhalb eines Monats.'},
      {h:'13. Beschwerderecht bei einer Aufsichtsbehörde',p:'Unbeschadet anderweitiger Rechtsbehelfe steht dir gemäß Art. 77 DSGVO ein Beschwerderecht bei einer Datenschutz-Aufsichtsbehörde zu, insbesondere in dem Mitgliedstaat deines Aufenthaltsorts, deines Arbeitsplatzes oder des Orts des mutmaßlichen Verstoßes. Eine Übersicht der zuständigen Landesbeauftragten für den Datenschutz ist über die Bundesbeauftragte für den Datenschutz und die Informationsfreiheit abrufbar.'},
      {h:'14. Datensicherheit',p:'Die Übertragung erfolgt ausschließlich verschlüsselt über TLS. Wir treffen dem Stand der Technik entsprechende technische und organisatorische Maßnahmen nach Art. 32 DSGVO, um deine Daten gegen Verlust, Zerstörung sowie unbefugten Zugriff und unbefugte Veränderung zu schützen. Hierzu zählen insbesondere Zugriffsbeschränkungen, Passwort-Hashing und regelmäßige Aktualisierung der eingesetzten Komponenten.'},
      {h:'15. Hinweise für minderjährige Nutzer',p:'Der Dienst richtet sich überwiegend an Schülerinnen und Schüler der Oberstufe. Personen, die das 16. Lebensjahr noch nicht vollendet haben, dürfen eine datenschutzrechtliche Einwilligung nur mit Zustimmung der Träger der elterlichen Verantwortung erteilen (Art. 8 DSGVO).\n\nWir fordern minderjährige Nutzer ausdrücklich auf, keine Daten anzugeben, die über die für die Nutzung erforderlichen Angaben hinausgehen, und im Zweifel gemeinsam mit einem Erziehungsberechtigten zu entscheiden. Erlangen wir Kenntnis davon, dass Daten ohne erforderliche Einwilligung erhoben wurden, löschen wir diese unverzüglich.'},
      {h:'16. Keine automatisierte Entscheidungsfindung',p:'Eine automatisierte Entscheidungsfindung einschließlich Profiling mit rechtlicher Wirkung im Sinne des Art. 22 DSGVO findet nicht statt.\n\nDie Ergebnisse des Interessentests sowie die Bewertungen von Studiengängen stellen unverbindliche Orientierungshilfen dar und entfalten keine rechtliche Wirkung gegenüber dir.'},
      {h:'17. Änderungen dieser Datenschutzerklärung',p:'Wir passen diese Datenschutzerklärung an, sobald Änderungen der Rechtslage oder des Funktionsumfangs dies erforderlich machen. Es gilt jeweils die auf dieser Seite veröffentlichte Fassung. Bei wesentlichen Änderungen informieren wir zusätzlich über die im Konto hinterlegte E-Mail-Adresse.'}
    ]
  }
};

function legalEscHandler(e){ if(e.key==='Escape') closeLegalModal(); }
function closeLegalModal(){

  LEGAL_MODAL_EL=null;
}

  GRADE_TABLE.forEach(function(b){
    var isCurrent=res&&res.passed&&res.gradeRaw===b[2];
    var range=b[0]===b[1]?(''+b[0]):(b[1]+'–'+b[0]);
    var tr=document.createElement('tr');
    if(isCurrent)tr.style.cssText='background:'+(S.dark?'rgba(29,78,216,.35)':'#dbeafe')+';font-weight:800';
    tr.innerHTML='<td>'+range+'</td><td>'+b[2]+(isCurrent?' ←':'')+'</td>';
    tbody.appendChild(tr);
  });
  var failTr=document.createElement('tr');
  var failHighlight=res&&!res.passed;
  if(failHighlight)failTr.style.cssText='background:'+(S.dark?'rgba(220,38,38,.25)':'#fee2e2')+';font-weight:800';
  failTr.innerHTML='<td>unter 300</td><td>nicht bestanden'+(failHighlight?' ←':'')+'</td>';
  tbody.appendChild(failTr);
  table.appendChild(tbody);
  var scroll=document.createElement('div');scroll.style.cssText='max-height:50vh;overflow-y:auto';scroll.appendChild(table);
  box.appendChild(scroll);
  overlay.appendChild(box);overlay.onclick=function(e){if(e.target===overlay){S.gradeTableModal=false;render();}};
  return overlay;
}

async function hydrateFromSession(session){
  var u=session.user;
  S.user={id:u.id,name:(u.user_metadata&&u.user_metadata.full_name)||u.email.split('@')[0],email:u.email,bundesland:'',premium:false};
  var row=await fetchProfile(u.id);
  profileLoaded=true;
  if(row && row.bundesland){
    applyProfileRow(row);
    initCalcDefaults();
    S.page='main';
  } else {
    // Logged in (e.g. via Google) but never finished onboarding yet
    S.page='onboarding';
  }
}

(async function initSession(){
  try{
    if(sb){
      var s=await sb.auth.getSession();
      if(s.data.session){
        await hydrateFromSession(s.data.session);
      }
    }
  }catch(e){
    console.warn('Session-Check fehlgeschlagen (evtl. offline):', e);
  }
  render();

  // Keep the app in sync if the session changes in another tab, refreshes, or completes
  // an OAuth redirect after this initial load.
  if(sb){
    sb.auth.onAuthStateChange(async function(event,session){
      if(event==='SIGNED_OUT'){
        if(S.user){ S.user=null; profileLoaded=false; S.page='landing'; render(); }
        return;
      }
      if(session && (!S.user || S.user.id!==session.user.id) && !profileLoaded){
        await hydrateFromSession(session);
        render();
      }
    });
  }
})();
</script>
